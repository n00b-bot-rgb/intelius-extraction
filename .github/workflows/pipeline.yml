name: Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate package compiles
        run: python -m compileall intelius

      - name: Run tests when collected
        run: |
          set +e
          pytest -q --collect-only
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            pytest -q
          elif [ "$status" -eq 5 ]; then
            echo "No tests collected; skipping pytest run."
          else
            exit "$status"
          fi
